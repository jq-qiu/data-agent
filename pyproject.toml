[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncmy==0.2.11",
    "cryptography==46.0.4",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]==0.128.0",
    "jieba==0.42.1",
    "langchain==1.2.7",
    "langchain-openai==1.2.1",
    "langgraph==1.0.7",
    "loguru==0.7.3",
    "omegaconf==2.3.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.16.2",
    "sqlalchemy==2.0.46",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
